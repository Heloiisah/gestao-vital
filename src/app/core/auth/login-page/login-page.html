<main class="login-screen"><section class="login-card"><div class="login-brand"><span class="brand-mark"><svg lucideHeartPulse aria-hidden="true"></svg></span><div><strong>gestão<span>vital</span></strong><small>FARMÁCIA HOSPITALAR</small></div></div><h1>Acesse sua unidade</h1><p>Entre para acompanhar estoque, movimentações e previsões.</p><form (ngSubmit)="submit()"><label class="field-label">E-mail<input name="email" type="email" autocomplete="username" [ngModel]="email()" (ngModelChange)="email.set($event)" required></label><label class="field-label">Senha<input name="password" type="password" autocomplete="current-password" [ngModel]="password()" (ngModelChange)="password.set($event)" required></label>@if (error()) { <p class="login-error" role="alert">{{ error() }}</p> }<button class="button button-primary" type="submit" [disabled]="busy()">{{ busy() ? 'Entrando…' : 'Entrar' }}</button></form><small class="login-foot">A autenticação e as permissões são verificadas pelo servidor.</small></section></main>
